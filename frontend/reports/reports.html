<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CIPHERX | Reports</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span class="logo-mark">C</span>
        <span>CIPHERX</span>
    </div>

    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="../admin/dashboard.html">
            Dashboard
        </a>

    </nav>

</header>


<main class="admin-page">

    <div class="admin-header">

        <div>

            <p class="eyebrow">
                ANALYTICS
            </p>

            <h1>
                Quiz
                <span>Reports.</span>
            </h1>

            <p class="admin-description">
                Review quiz performance, player results
                and competition statistics.
            </p>

        </div>

    </div>


    <section class="quiz-management">

        <div class="section-heading">

            <div>

                <p class="eyebrow">
                    AVAILABLE REPORTS
                </p>

                <h2>
                    Quiz History
                </h2>

            </div>

        </div>


        <div class="quiz-table">

            <div class="quiz-row header">

                <span>
                    Quiz
                </span>

                <span>
                    Quiz ID
                </span>

                <span>
                    Players
                </span>

                <span>
                    Action
                </span>

            </div>


            <div id="reportsList">

                <div class="empty-state">

                    <h3>
                        No reports available
                    </h3>

                    <p>
                        Completed quiz reports will
                        appear here.
                    </p>

                </div>

            </div>

        </div>

    </section>

</main>


<script src="../js/reports.js"></script>

</body>

</html>
