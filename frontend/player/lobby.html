<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHERX | Lobby</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/player.css">
</head>

<body>

<header class="navbar">
    <div class="logo">
        <span class="logo-mark">C</span>
        <span>CIPHERX</span>
    </div>
</header>

<main class="player-page">

    <div class="lobby-card">

        <p class="eyebrow">QUIZ LOBBY</p>

        <h1>You're <span>In.</span></h1>

        <p class="lobby-status">
            Waiting for the administrator to start the quiz...
        </p>

        <div class="quiz-info">

            <div>
                <span>Quiz ID</span>
                <strong id="lobbyQuizId">---</strong>
            </div>

            <div>
                <span>Player</span>
                <strong id="lobbyPlayerName">---</strong>
            </div>

            <div>
                <span>Players Joined</span>
                <strong id="playerCount">0</strong>
            </div>

        </div>

        <div class="waiting-indicator">
            <div class="loader"></div>
            <p>Waiting for quiz to start</p>
        </div>

    </div>

</main>

<script src="../js/player.js"></script>

</body>
</html>
